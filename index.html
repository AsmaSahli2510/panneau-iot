<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panneau IoT — Armoire</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     Jetons de design : palette "boîtier électrique"
     ============================================================ */
  :root{
    --bg:        #eef1f5;
    --bezel:     #ffffff;
    --panel:     #f6f8fa;
    --recess:    #e4e8ed;
    --border:    #d9dee4;
    --text:      #1c232c;
    --text-dim:  #6b7480;

    --amber:     #c2660c; /* accent température */
    --amber-dim: #f3ddbb;
    --cyan:      #0a8c80; /* accent humidité */
    --cyan-dim:  #c9ece7;
    --led-on:    #16a34a;
    --led-off:   #c9cfd6;

    --track:     #e4e8ed;
    --radius-panel: 22px;
    --radius-module: 16px;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    background:
      radial-gradient(circle at 30% 0%, #ffffff 0%, var(--bg) 60%);
    font-family:'Space Grotesk', Arial, sans-serif;
    color:var(--text);
  }

  /* ============================================================
     Boîtier principal — imite un panneau monté en armoire
     ============================================================ */
  .panel{
    width:100%;
    max-width:560px;
    background:var(--bezel);
    border-radius:var(--radius-panel);
    border:1px solid var(--border);
    padding:22px;
    box-shadow:
      0 24px 50px -24px rgba(15,23,42,0.18),
      inset 0 1px 0 rgba(255,255,255,0.8);
  }

  .panel-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:6px 6px 20px;
    border-bottom:1px solid var(--border);
    margin-bottom:20px;
  }
  .panel-header h1{
    margin:0;
    font-size:19px;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .subtitle{
    margin:4px 0 0;
    font-size:13px;
    color:var(--text-dim);
  }

  .status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--text-dim);
    padding-top:4px;
  }
  .status-dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--led-off);
    transition:background .3s ease, box-shadow .3s ease;
  }
  .status-dot.on{
    background:var(--led-on);
    box-shadow:0 0 6px rgba(22,163,74,0.4);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.55; }
  }

  /* ============================================================
     Grille des modules
     ============================================================ */
  .modules{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:420px){
    .modules{ grid-template-columns:1fr; }
  }

  .module{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-module);
    padding:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.8), 0 1px 2px rgba(15,23,42,0.04);
  }
  .module-label{
    font-size:12.5px;
    color:var(--text-dim);
    align-self:flex-start;
  }

  /* ============================================================
     Interrupteur à bascule (LED1 / LED2)
     ============================================================ */
  .switch{
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .switch:focus-visible .switch-track{
    outline:2px solid var(--cyan);
    outline-offset:3px;
  }
  .switch-track{
    display:block;
    width:64px;
    height:34px;
    border-radius:999px;
    background:var(--recess);
    border:1px solid var(--border);
    position:relative;
    transition:background .25s ease, border-color .25s ease;
  }
  .switch-thumb{
    position:absolute;
    top:3px; left:3px;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--led-off);
    transition:transform .25s cubic-bezier(.4,0,.2,1), background .25s ease, box-shadow .25s ease;
  }
  .switch.on .switch-track{ border-color:var(--led-on); }
  .switch.on .switch-thumb{
    transform:translateX(30px);
    background:var(--led-on);
    box-shadow:0 0 8px rgba(22,163,74,0.45);
  }

  .module-state{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--text-dim);
  }
  .switch.on ~ .module-state{ color:var(--led-on); }

  /* ============================================================
     Jauges circulaires (température / humidité)
     ============================================================ */
  .gauge-module.temp{ --accent:var(--amber); --accent-dim:var(--amber-dim); }
  .gauge-module.hum{  --accent:var(--cyan);  --accent-dim:var(--cyan-dim); }

  .gauge{
    --pct:0;
    width:104px; height:104px;
    border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--pct)*3.6deg), var(--track) 0);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition:background .6s ease;
  }
  .gauge::before{
    content:"";
    position:absolute;
    inset:9px;
    border-radius:50%;
    background:var(--panel);
  }
  .gauge-value{
    position:relative;
    z-index:1;
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    display:flex;
    align-items:baseline;
    gap:2px;
    transition:color .25s ease, text-shadow .25s ease;
  }
  .gauge-value span:first-child{ font-size:22px; }
  .unit{ font-size:11px; color:var(--text-dim); }

  .gauge-value.flash{
    color:var(--accent);
  }

  @media (prefers-reduced-motion: reduce){
    .switch-thumb, .gauge, .status-dot, .gauge-value{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<div class="panel">

  <!-- En-tête : titre + indicateur de connexion Firebase en direct -->
  <div class="panel-header">
    <div>
      <h1>Panneau de contrôle</h1>
      <p class="subtitle">Armoire — supervision temps réel</p>
    </div>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connexion…</span>
    </div>
  </div>

  <div class="modules">

    <!-- Interrupteur LED 1 -->
    <div class="module">
      <div class="module-label">LED 1</div>
      <button class="switch" id="sw1" role="switch" aria-checked="false" aria-label="LED 1">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </button>
      <div class="module-state" id="state1">Éteinte</div>
    </div>

    <!-- Interrupteur LED 2 -->
    <div class="module">
      <div class="module-label">LED 2</div>
      <button class="switch" id="sw2" role="switch" aria-checked="false" aria-label="LED 2">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </button>
      <div class="module-state" id="state2">Éteinte</div>
    </div>

    <!-- Jauge Température -->
    <div class="module gauge-module temp">
      <div class="module-label">Température</div>
      <div class="gauge" id="gaugeTemp">
        <div class="gauge-value" id="tempValueWrap">
          <span id="tempValue">--</span><span class="unit">°C</span>
        </div>
      </div>
    </div>

    <!-- Jauge Humidité -->
    <div class="module gauge-module hum">
      <div class="module-label">Humidité</div>
      <div class="gauge" id="gaugeHum">
        <div class="gauge-value" id="humValueWrap">
          <span id="humValue">--</span><span class="unit">%</span>
        </div>
      </div>
    </div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

  // Configuration Firebase — même projet que le TP1/TP2 (controle-leds-c1d38)
  const firebaseConfig = {
    apiKey: "AIzaSyDkPqhBhhNVYdcAE3nxZkwfj8OoQD6XvMo",
    authDomain: "controle-leds-c1d38.firebaseapp.com",
    databaseURL: "https://controle-leds-c1d38-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "controle-leds-c1d38"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Indicateur de connexion (vraie valeur Firebase) ---------- */
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  onValue(ref(db, ".info/connected"), snap => {
    const connected = snap.val() === true;
    dot.classList.toggle('on', connected);
    statusText.textContent = connected ? 'En direct' : 'Hors ligne';
  });

  /* ---------- Interrupteurs LED : écrivent ET écoutent Firebase ---------- */
  function bindSwitch(path, btnId, stateId, onLabel, offLabel) {
    const btn = document.getElementById(btnId);
    const stateEl = document.getElementById(stateId);
    const dbRef = ref(db, path);

    btn.addEventListener('click', () => {
      const next = btn.getAttribute('aria-checked') !== 'true';
      set(dbRef, next);
    });

    onValue(dbRef, snap => {
      const state = snap.val() === true;
      btn.classList.toggle('on', state);
      btn.setAttribute('aria-checked', state);
      stateEl.textContent = state ? onLabel : offLabel;
    });
  }

  bindSwitch('/Led_1', 'sw1', 'state1', 'Allumée', 'Éteinte');
  bindSwitch('/Led_2', 'sw2', 'state2', 'Allumée', 'Éteinte');

  /* ---------- Jauges : lecture seule, avec flash à chaque mise à jour ---------- */
  function bindGauge(path, gaugeId, valueId, wrapId, min, max) {
    const gauge = document.getElementById(gaugeId);
    const valueEl = document.getElementById(valueId);
    const wrapEl = document.getElementById(wrapId);

    onValue(ref(db, path), snap => {
      const raw = snap.val();
      if (raw === null || raw === undefined) return;
      const value = Number(raw);
      const clamped = Math.min(max, Math.max(min, value));
      const pct = ((clamped - min) / (max - min)) * 100;

      gauge.style.setProperty('--pct', pct);
      valueEl.textContent = Number.isInteger(value) ? value : value.toFixed(1);

      if (!reduceMotion) {
        wrapEl.classList.add('flash');
        setTimeout(() => wrapEl.classList.remove('flash'), 500);
      }
    });
  }

  bindGauge('/temperature', 'gaugeTemp', 'tempValue', 'tempValueWrap', 0, 50);
  bindGauge('/humidity', 'gaugeHum', 'humValue', 'humValueWrap', 0, 100);
</script>

</body>
</html>
